services:
  api:
    build: .
    restart: unless-stopped
    environment:
      HTTP_ADDR: 0.0.0.0:3000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-alumnee}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-alumnee}
      DEMO_AUTH_ENABLED: ${DEMO_AUTH_ENABLED:-false}
      DEMO_AUTH_PASSWORD: ${DEMO_AUTH_PASSWORD:-}
      STAGING_AUTH_NON_VERIFIED_USERNAME: ${STAGING_AUTH_NON_VERIFIED_USERNAME:-}
      STAGING_AUTH_NON_VERIFIED_PASSWORD: ${STAGING_AUTH_NON_VERIFIED_PASSWORD:-}
      STAGING_AUTH_VERIFIED_USERNAME: ${STAGING_AUTH_VERIFIED_USERNAME:-}
      STAGING_AUTH_VERIFIED_PASSWORD: ${STAGING_AUTH_VERIFIED_PASSWORD:-}
      STAGING_AUTH_OFFICER_USERNAME: ${STAGING_AUTH_OFFICER_USERNAME:-}
      STAGING_AUTH_OFFICER_PASSWORD: ${STAGING_AUTH_OFFICER_PASSWORD:-}
      STAGING_AUTH_ADMIN_USERNAME: ${STAGING_AUTH_ADMIN_USERNAME:-}
      STAGING_AUTH_ADMIN_PASSWORD: ${STAGING_AUTH_ADMIN_PASSWORD:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      FACEBOOK_OAUTH_CLIENT_ID: ${FACEBOOK_OAUTH_CLIENT_ID:-}
      FACEBOOK_OAUTH_CLIENT_SECRET: ${FACEBOOK_OAUTH_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
      STAGING_SCENARIO_PASSWORD: ${STAGING_SCENARIO_PASSWORD:-}
      STAGING_SCENARIO_RESET: ${STAGING_SCENARIO_RESET:-false}
      STAGING_SCENARIO_ADMIN_USERNAME: ${STAGING_SCENARIO_ADMIN_USERNAME:-admin.uji}
      STAGING_SCENARIO_OFFICER_1_USERNAME: ${STAGING_SCENARIO_OFFICER_1_USERNAME:-pengurus.satu}
      STAGING_SCENARIO_OFFICER_2_USERNAME: ${STAGING_SCENARIO_OFFICER_2_USERNAME:-pengurus.dua}
      STAGING_SCENARIO_MEMBER_1_USERNAME: ${STAGING_SCENARIO_MEMBER_1_USERNAME:-alumni.satu}
      STAGING_SCENARIO_MEMBER_2_USERNAME: ${STAGING_SCENARIO_MEMBER_2_USERNAME:-alumni.dua}
      STAGING_SCENARIO_MEMBER_3_USERNAME: ${STAGING_SCENARIO_MEMBER_3_USERNAME:-alumni.tiga}
      STAGING_SCENARIO_MEMBER_4_USERNAME: ${STAGING_SCENARIO_MEMBER_4_USERNAME:-alumni.empat}
      STAGING_SCENARIO_MEMBER_5_USERNAME: ${STAGING_SCENARIO_MEMBER_5_USERNAME:-alumni.lima}
      STAGING_SCENARIO_MEMBER_6_USERNAME: ${STAGING_SCENARIO_MEMBER_6_USERNAME:-alumni.enam}
      STAGING_SCENARIO_MEMBER_7_USERNAME: ${STAGING_SCENARIO_MEMBER_7_USERNAME:-alumni.tujuh}
      LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-5}
      FILE_STORAGE_DIR: /var/lib/alumnee/files
    expose:
      - "3000"
    volumes:
      - alumni-files:/var/lib/alumnee/files
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/v1/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5

  migrate:
    build: .
    entrypoint: ["/usr/local/bin/migrate"]
    profiles: ["tools"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-alumnee}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-alumnee}
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-alumnee}
      MYSQL_USER: ${MYSQL_USER:-alumnee}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    command:
      - --default-storage-engine=InnoDB
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql

  caddy:
    build:
      context: ../cms-alumnee-fe
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_DEMO_AUTH_ENABLED: ${NEXT_PUBLIC_DEMO_AUTH_ENABLED:-false}
        NEXT_PUBLIC_GOOGLE_OAUTH_ENABLED: ${NEXT_PUBLIC_GOOGLE_OAUTH_ENABLED:-false}
        NEXT_PUBLIC_FACEBOOK_OAUTH_ENABLED: ${NEXT_PUBLIC_FACEBOOK_OAUTH_ENABLED:-false}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  mysql-data:
  alumni-files:
  caddy-data:
  caddy-config:
