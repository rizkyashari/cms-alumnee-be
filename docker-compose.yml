version: '3.8'

services:
  web:
    container_name: lms-web-api
    build: .
    restart: "no"
    env_file:
      - .env
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - .:/usr/src/app
    command: go run ./cmd/main.go
    depends_on:
      - db
      - adminer
      - redis
      # - strapi

  db:
    container_name: lms-db
    image: postgres:alpine
    restart: on-failure
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    networks:
      default:
        aliases:
          - ${DB_HOST}
    volumes:
      - "postgres-db:/var/lib/postgresql/data"
  
  adminer:
    container_name: lms-adminer
    image: adminer:standalone
    restart: on-failure
    ports:
      - "8083:8080"
  
  redis:
    container_name: lms-redis
    image: redis:alpine
    restart: on-failure
    env_file: .env
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6378:6379/tcp"
    networks:
      default:
        aliases:
          - ${REDIS_HOST}

  # strapi:
